name: Saturation evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run in-memory evaluator tests
        run: python -B .agents/skills/saturation/evals/test_grader.py

      - name: Run quality comparison tests
        run: python -B .agents/skills/saturation/evals/test_quality_comparison.py

      - name: Run quality comparison edge tests
        run: >-
          python -B
          .agents/skills/saturation/evals/test_quality_comparison_edges.py

      - name: Run quality comparison branch tests
        run: >-
          python -B
          .agents/skills/saturation/evals/test_quality_comparison_missing_branches.py

      - name: Run quality comparison numeric edge tests
        run: >-
          python -B
          .agents/skills/saturation/evals/test_quality_comparison_numeric_edges.py
